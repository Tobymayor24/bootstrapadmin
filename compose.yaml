services:
  staradmin:
    build:
      context: .
      dockerfile: Dockerfile
    image: staradmin-web
    container_name: staradmin-web
    ports:
      - "${STARADMIN_PORT:-3000}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://localhost || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
