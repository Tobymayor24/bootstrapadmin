name: StarAdmin CI/CD

on:
  push:
    branches:
      - branch2
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staradmin-production
  cancel-in-progress: false

jobs:
  ci:
    name: Validate Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Build application image
        run: docker build --tag staradmin-web:${{ github.sha }} .

  deploy:
    name: Deploy to server
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read

      - name: Check out source
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare server deployment directory
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          #fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          request_pty: false
          script: |
            set -e
            mkdir -p /opt/myapps3

      - name: Copy app files to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          #fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          source: "Dockerfile,compose.yaml,nginx.conf,src"
          target: /opt/myapps3
          overwrite: true
          command_timeout: 10m

      - name: Start or update Compose application
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_PRIVATE_KEY }}
          port: ${{ secrets.VM_SSH_PORT || 22 }}
          #fingerprint: ${{ secrets.VM_HOST_FINGERPRINT }}
          command_timeout: 15m
          request_pty: false
          script: |
            set -e
            cd /opt/myapps3
            docker rm -f staradmin-web >/dev/null 2>&1 || true
            docker compose up -d --build --remove-orphans
            docker compose ps
